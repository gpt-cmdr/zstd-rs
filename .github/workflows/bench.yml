name: Benchmark against the C library

# Times the crate against the zstd C library on tiles of public rasters, on each kind of hosted runner.
# Run it by hand (Actions, "Run workflow") or by pushing a branch named bench/* (the repository has a branch named ci, so ci/... names cannot exist). Shared runners are
# noisy: compare the ratios to the C library, which ran on the same machine in the same job, and run it
# more than once.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs of each measurement (the best counts)
        default: "7"
  push:
    branches: ["bench/*"]

permissions:
  contents: read

jobs:
  rasterbench:
    name: rasterbench ${{ matrix.os }}${{ matrix.variant && format(' ({0})', matrix.variant) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every job is listed: an `include` entry that only names an existing `os` would change that job
        # instead of adding one.
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: windows-latest
          # The C library decodes Huffman streams with hand-written assembly on x86-64 (not with MSVC, and
          # not on other processors). This job builds it without, to tell how much of a difference on
          # Linux x86-64 is the assembly and how much the C compiler.
          - os: ubuntu-latest
            variant: C library without assembly
            artifact: -no-asm
            cflags: -DZSTD_DISABLE_ASM
    defaults:
      run:
        shell: bash
    env:
      RUNS: ${{ inputs.runs || '7' }}
      CFLAGS: ${{ matrix.cflags }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Machine
        run: |
          case "$RUNNER_OS" in
            Linux) cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
                   cores=$(nproc) ;;
            macOS) cpu=$(sysctl -n machdep.cpu.brand_string)
                   cores=$(sysctl -n hw.ncpu) ;;
            Windows) cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name")
                     cores=$NUMBER_OF_PROCESSORS ;;
          esac
          {
            echo "## rasterbench on ${{ matrix.os }}${{ matrix.variant && format(' ({0})', matrix.variant) || '' }}"
            echo
            echo "- CPU: $(echo "$cpu" | tr -d '\r') ($cores logical cores, $RUNNER_ARCH)"
            echo "- Image: $ImageOS $ImageVersion"
            echo "- Compiler: $(rustc --version), host $(rustc -vV | sed -n 's/^host: //p')"
            echo "- Timed runs: $RUNS (the best counts; level 19 runs once)"
          } | tee machine.md
          if [ "$RUNNER_OS" = Linux ]; then lscpu; fi

      - name: Build the example
        run: |
          cargo build --release --example rasterbench
          tree=$(cargo tree -p zstd-rust --prefix none)
          echo "- C library: $(grep '^zstd-sys' <<< "$tree" | sort -u), CFLAGS \"$CFLAGS\"" | tee -a machine.md
          if [ "$RUNNER_OS" != Windows ]; then
            echo "- Symbols of the C library's Huffman assembly in the binary: $(nm target/release/examples/rasterbench | grep -c fast_asm_loop || true)" | tee -a machine.md
          fi

      - name: Download the rasters and cut them into chunks
        run: |
          python -m pip install --quiet numpy rasterio
          python ruzstd/benches/raster_chunks.py --download bench-data/rasters bench-data/chunks | tee chunks.txt

      - name: Run
        run: |
          ./target/release/examples/rasterbench bench-data/chunks | tee rasterbench.txt

      - name: Summary
        if: always()
        run: |
          {
            cat machine.md
            echo
            python ruzstd/benches/rasterbench_table.py < rasterbench.txt
            echo
            echo "<details><summary>Output of the example</summary>"
            echo
            echo '```'
            cat rasterbench.txt
            echo '```'
            echo
            echo "</details>"
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rasterbench-${{ matrix.os }}${{ matrix.artifact }}
          path: |
            summary.md
            machine.md
            rasterbench.txt
            chunks.txt
          if-no-files-found: warn
