[package]
name = "zstd-rust"
version = "0.1.0"
rust-version = "1.87"
authors = [
    "Moritz Borcherding <moritz.borcherding@web.de>",
    "William Katzenmeyer / CLB Engineering Corporation",
]
edition = "2018"
license = "MIT"
homepage = "https://github.com/gpt-cmdr/zstd-rs"
repository = "https://github.com/gpt-cmdr/zstd-rs"
documentation = "https://docs.rs/zstd-rust"
description = "Pure Rust zstd decoder and compressor: an independently maintained fork of ruzstd with a faster, smaller compressor"
exclude = ["decodecorpus_files/*", "dict_tests/*", "fuzz_decodecorpus/*", "fuzz/*"]
readme = "Readme.md"
keywords = ["zstd", "zstandard", "compression", "decompression", "no-std"]
categories = ["compression"]

[dependencies]
# Locked behind the `hash` feature flag
twox-hash = { version = "2.0", default-features = false, features = ["xxhash64"], optional = true }
fastrand = {version = "2.3.0", optional = true }

# Internal feature, only used when building as part of libstd, not part of the
# stable interface of this crate.
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }

[dev-dependencies]
criterion = "0.5"
rand = { version = "0.8.5", features = ["small_rng"] }
zstd = "0.13.2"

[features]
default = ["hash", "std"]
dict_builder = ["std", "dep:fastrand"]
hash = ["dep:twox-hash"]
fuzz_exports = []
std = []

# Internal feature, only used when building as part of libstd, not part of the
# stable interface of this crate.
rustc-dep-of-std = ["dep:core", "dep:alloc"]

[[bench]]
name = "decode_all"
harness = false

# Compares with the zstd C library (a dev-dependency) through `std::io`.
[[example]]
name = "rasterbench"
required-features = ["std"]
